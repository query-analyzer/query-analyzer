services:
  postgres:
    image: postgres:15-alpine
    container_name: queryanalyzer-postgres
    environment:
      POSTGRES_DB: queryanalyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../..
      dockerfile: query-analyzer-examples/example-postgres/Dockerfile
    container_name: queryanalyzer-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/queryanalyzer
      SPRING_DATASOURCE_USERNAME: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: