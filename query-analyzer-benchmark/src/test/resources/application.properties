# H2 in-memory database for the benchmark
spring.datasource.url=jdbc:h2:mem:bench;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Register query-analyzer's capture hook at the Hibernate level. This gives every
# detector the SAME trace, with REAL Hibernate stack frames, so CONFIDENCE mode is
# evaluated under realistic conditions.
spring.jpa.properties.hibernate.session_factory.statement_inspector=io.queryanalyzer.benchmark.capture.CapturingStatementInspector
